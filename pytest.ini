[pytest]
minversion = 7.0
addopts = --verbose --durations=10 --junitxml=junit.xml --cov
    --cov-report term --cov-report html --cov-report xml
testpaths = pymablock
required_plugins = pytest-randomly pytest-cov pytest-regressions
filterwarnings =
    error
    ignore:ast.NameConstant is deprecated:DeprecationWarning:sympy
    # SymPy 1.14 calls this deprecated mpmath helper internally.
    ignore:bitcount function is deprecated:DeprecationWarning
