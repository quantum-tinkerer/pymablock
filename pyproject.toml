[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pymablock"
dynamic = ["version"]
authors = [
  {name="Pymablock developers"},
]
description = "Numerical and symbolic implementation of quasi-degenerate perturbation theory"
readme = "README.md"
# This project follows https://scientific-python.org/specs/spec-0000/
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2",
    "scipy>=1.15",
    "sympy>=1.14",
    "packaging>=22.0",  # For version parsing
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: BSD License",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-cov>=6", "pytest-randomly>=3.16", "pytest-regressions>=2.5"]
docs = ["sphinx-book-theme>=1.1.0", "sphinx-tippy"]
mumps = ["python-mumps>=0.0.1,<0.1"]

[project.urls]
"Documentation" = "https://pymablock.readthedocs.io/en/latest/"
"Repository" = "https://gitlab.kwant-project.org/qt/pymablock"
"Bug Tracker" = "https://gitlab.kwant-project.org/qt/pymablock/-/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "pymablock/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["pymablock"]

[tool.hatch.build.targets.sdist]
include = [
  "pymablock",
  "README.md",
  "LICENSE",
  "pyproject.toml",
  "pytest.ini",
  "AUTHORS.md",
  "CITATION.cff",
]

[tool.ruff]
line-length = 90
exclude = [
  "paper",  # not part of the library
  "pymablock/_version.py",  # generated automatically
  "docs/source/conf.py",
  "pymablock/__init__.py",
  "trace_perturbation/*",  # not part of the library
]

[tool.ruff.lint]
extend-select = [
  "N",
  "D",
  "W",
  "I",
  "T10",
  "Q",
  "RSE",
  "RET",
  "TCH",
  "INT",
  "ARG",
  "R",
  "FLY",
  "RUF",
]
ignore = [
"N802",  # invalid-function-name
"N803",  # invalid-argument-name
"N806",  # non-lowercase-variable-in-function
"D203",  # 1 blank line required before class docstring
"D213",  # Multi-line docstring summary should start at the second line
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.extend-per-file-ignores]
"pymablock/block_diagonalization.py" = [
  "RET503",  # implicit-return
  "RET504",  # unnecessary-assign
]
"pymablock/tests/*.py" = [
  "RET504",
  "D",  # documentation in tests not necessary
]

[tool.coverage.run]
include = [
  "pymablock/*",
]
omit = [
  "pymablock/algorithms.py",
]

[tool.mypy]
# Not using mypy yet, but this is a start.
python_version = "3.12"
allow_redefinition = true
[[tool.mypy.overrides]]
module = [
  "scipy",
  "scipy.sparse",
  "scipy.sparse.linalg",
  "scipy.sparse.linalg._interface",
]
ignore_missing_imports = true

[tool.codespell]
skip = "*.cls,*.bst,*.bib,*.lock"
ignore-words-list = "nwo,groth,ket,braket"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.environments]
default = { solve-group = "default" }
docs = { features = ["docs"], solve-group = "mid" }
minimal = { features = ["minimal", "test", "mumps"], solve-group = "minimal" }
mid = { features = ["mid", "test", "mumps"], solve-group = "mid" }
latest = { features = ["latest", "test", "mumps"], solve-group = "default" }
latest-no-mumps = { features = ["latest", "test"], solve-group = "default" }
precommit = { features = ["precommit"], no-default-feature = true }
publish = { features = ["publish"], no-default-feature = true }

# Default feature

[tool.pixi.activation.env]
OPENBLAS_NUM_THREADS = "1"
OMP_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
MKL_DYNAMIC = "FALSE"

[tool.pixi.dependencies]
python = ">=3.12"
numpy = ">=2.2"
scipy = ">=1.15"
sympy = ">=1.14"
packaging = ">=22.0" # For version parsing
git = "*"

[tool.pixi.pypi-dependencies]
pymablock = { path = ".", editable = true }

[tool.pixi.tasks]
tests-minimal = "pixi run -e minimal tests"
tests-mid = "pixi run -e mid tests"
tests-latest = "pixi run -e latest tests"
tests-latest-no-mumps = "pixi run -e latest-no-mumps tests"
tests-all = { depends-on = ["tests-minimal", "tests-mid", "tests-latest-no-mumps", "tests-latest"] }

# Features

# Resolve the package's declared lower bounds, keeping transitive dependencies current.
[tool.pixi.feature.minimal]
solve-strategy = "lowest-direct"

# Pixi has no midpoint strategy; retain intermediate dependency coverage explicitly.
[tool.pixi.feature.mid.dependencies]
python = "~=3.13.0"
numpy = "~=2.3.0"
scipy = "~=1.16.0"

[tool.pixi.feature.latest]
solve-strategy = "highest"

[tool.pixi.feature.mumps.dependencies]
python-mumps = ">=0.0.1,<0.1"

[tool.pixi.feature.docs.dependencies]
kwant = "*"
myst-nb = "*"
matplotlib-base = "*"
sphinx = ">=8.2.0"
sphinx-togglebutton = "*"
sphinx-copybutton = "*"
sphinx-book-theme = "*"
beautifulsoup4 = "*"
git = "*"

[tool.pixi.feature.docs.tasks.docs-build]
cmd = "python -c \"from matplotlib import pyplot\" && python docs/fetch_intersphinx.py && sphinx-build -b html -n -WT docs/source docs/build/html"

# Test tooling must support Python 3.12 and warnings-as-errors.
[tool.pixi.feature.test.dependencies]
pytest = ">=8.3"
pytest-cov = ">=6"
pytest-randomly = ">=3.16"
pytest-regressions = ">=2.5"

[tool.pixi.feature.test.tasks]
tests = "pytest"

[tool.pixi.feature.precommit.dependencies]
pre-commit = "*"
git = "*"

[tool.pixi.feature.precommit.tasks]
git = "git"
pre-commit = "pre-commit"

[tool.pixi.feature.publish.dependencies]
hatch = ">=1.7.0"
hatch-vcs = ">=0.5"
git = "*"

[tool.pixi.feature.publish.tasks]
build = "hatch build"
publish = "hatch publish -u __token__"
