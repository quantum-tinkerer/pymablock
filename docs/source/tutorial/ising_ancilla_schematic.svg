<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-labelledby="title description">
  <title id="title">Ising chain coupled to a two-level ancilla</title>
  <desc id="description">A two-level ancilla with detuning Delta couples through g times the total magnetization to an open Ising chain with coupling J and field h.</desc>

  <rect x="2" y="2" width="756" height="216" rx="14" fill="#ffffff" stroke="#d7dde5" stroke-width="2"/>

  <rect x="300" y="18" width="160" height="48" rx="12" fill="#f4e8ff" stroke="#7b2cbf" stroke-width="3"/>
  <text x="380" y="39" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="600" fill="#2b2033">ancilla</text>
  <text x="380" y="57" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b2033">|A&#x27E9; &#x2194; |B&#x27E9; &#x2003; &#x394;</text>

  <line x1="380" y1="66" x2="380" y2="119" stroke="#7b2cbf" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="394" y="98" font-family="sans-serif" font-size="17" font-weight="600" fill="#7b2cbf">gM_z</text>

  <g stroke="#51606f" stroke-width="4" stroke-linecap="round">
    <line x1="110" y1="148" x2="245" y2="148"/>
    <line x1="245" y1="148" x2="340" y2="148"/>
    <line x1="420" y1="148" x2="515" y2="148"/>
    <line x1="515" y1="148" x2="650" y2="148"/>
  </g>
  <text x="178" y="136" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#51606f">J</text>
  <text x="582" y="136" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#51606f">J</text>
  <text x="380" y="154" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#51606f">&#x22EF;</text>

  <g fill="#e1f2fb" stroke="#277da1" stroke-width="3">
    <circle cx="110" cy="148" r="24"/>
    <circle cx="245" cy="148" r="24"/>
    <circle cx="515" cy="148" r="24"/>
    <circle cx="650" cy="148" r="24"/>
  </g>
  <g font-family="sans-serif" font-size="17" font-weight="600" fill="#173849" text-anchor="middle">
    <text x="110" y="154">Z&#x2081;</text>
    <text x="245" y="154">Z&#x2082;</text>
    <text x="515" y="154">Z&#x2097;&#x208B;&#x2081;</text>
    <text x="650" y="154">Z&#x2097;</text>
  </g>

  <g stroke="#277da1" stroke-width="3">
    <line x1="110" y1="199" x2="110" y2="178"/>
    <line x1="245" y1="199" x2="245" y2="178"/>
    <line x1="515" y1="199" x2="515" y2="178"/>
    <line x1="650" y1="199" x2="650" y2="178"/>
  </g>
  <text x="380" y="205" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#277da1">field h</text>
</svg>
