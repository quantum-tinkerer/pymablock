<svg xmlns="http://www.w3.org/2000/svg" width="700" height="190" viewBox="0 0 700 190" role="img" aria-labelledby="title description">
  <title id="title">Transverse-field Ising chain coupled to an ancilla</title>
  <desc id="description">An open Ising chain with ZZ coupling and transverse X field couples through its total Z magnetization to a detuned two-level ancilla.</desc>

  <rect x="275" y="10" width="150" height="42" rx="10" fill="#f4e8ff" stroke="#7b2cbf" stroke-width="2.5"/>
  <text x="350" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#2b2033">ancilla</text>
  <text x="350" y="45" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2b2033">A &#x2194; B &#x2003; &#x394;</text>

  <line x1="350" y1="52" x2="350" y2="91" stroke="#7b2cbf" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="362" y="78" font-family="sans-serif" font-size="15" font-weight="600" fill="#7b2cbf">gM<tspan baseline-shift="sub" font-size="11">z</tspan></text>

  <g stroke="#51606f" stroke-width="3.5" stroke-linecap="round">
    <line x1="80" y1="116" x2="210" y2="116"/>
    <line x1="210" y1="116" x2="300" y2="116"/>
    <line x1="400" y1="116" x2="490" y2="116"/>
    <line x1="490" y1="116" x2="620" y2="116"/>
  </g>
  <text x="145" y="105" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#51606f">J ZZ</text>
  <text x="350" y="122" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#51606f">&#x22EF;</text>

  <g fill="#e1f2fb" stroke="#277da1" stroke-width="2.5">
    <circle cx="80" cy="116" r="20"/>
    <circle cx="210" cy="116" r="20"/>
    <circle cx="490" cy="116" r="20"/>
    <circle cx="620" cy="116" r="20"/>
  </g>

  <g stroke="#277da1" stroke-width="2.5" fill="none">
    <path d="M80 174 V143 M75 150 L80 143 L85 150"/>
    <path d="M210 174 V143 M205 150 L210 143 L215 150"/>
    <path d="M490 174 V143 M485 150 L490 143 L495 150"/>
    <path d="M620 174 V143 M615 150 L620 143 L625 150"/>
  </g>
  <text x="350" y="181" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#277da1">transverse field h<tspan baseline-shift="sub" font-size="10">x</tspan> X<tspan baseline-shift="sub" font-size="10">i</tspan></text>
</svg>
