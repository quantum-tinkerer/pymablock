<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="title desc">
  <title id="title">Trace and Hermiticity mask rules in a paired eigenbasis</title>
  <desc id="desc">A 9 by 9 mask grid shows a trace-protected row and a pair of Hermiticity-related entries.</desc>
  <defs>
    <style>
      .title { font: 600 18px sans-serif; fill: #25303b; }
      .label { font: 13px sans-serif; fill: #4f5d68; }
      .axis { font: 12px monospace; fill: #4b5563; dominant-baseline: middle; text-anchor: middle; }
      .cell { fill: #f8faf7; stroke: #c9d1c9; stroke-width: 1; }
      .trace { fill: #dfeef8; }
      .pair-a { fill: #bfe3c0; stroke: #4f8f58; stroke-width: 2; }
      .pair-b { fill: #d8edc8; stroke: #4f8f58; stroke-width: 2; }
      .line { stroke: #4f8f58; stroke-width: 2; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <text x="180" y="34" class="title">Boolean mask in a paired eigenbasis</text>
  <text x="86" y="86" class="label">output mode alpha</text>
  <text x="380" y="394" class="label">input mode beta</text>

  <g transform="translate(135,70)">
    <g class="axis">
      <text x="20" y="-15">00</text><text x="60" y="-15">01</text><text x="100" y="-15">02</text>
      <text x="140" y="-15">10</text><text x="180" y="-15">11</text><text x="220" y="-15">12</text>
      <text x="260" y="-15">20</text><text x="300" y="-15">21</text><text x="340" y="-15">22</text>
      <text x="-20" y="20">00</text><text x="-20" y="60">01</text><text x="-20" y="100">02</text>
      <text x="-20" y="140">10</text><text x="-20" y="180">11</text><text x="-20" y="220">12</text>
      <text x="-20" y="260">20</text><text x="-20" y="300">21</text><text x="-20" y="340">22</text>
    </g>
    <rect x="0" y="0" width="360" height="40" class="trace"/>
    <g>
      <rect x="0" y="0" width="40" height="40" class="cell trace"/><rect x="40" y="0" width="40" height="40" class="cell trace"/><rect x="80" y="0" width="40" height="40" class="cell trace"/><rect x="120" y="0" width="40" height="40" class="cell trace"/><rect x="160" y="0" width="40" height="40" class="cell trace"/><rect x="200" y="0" width="40" height="40" class="cell trace"/><rect x="240" y="0" width="40" height="40" class="cell trace"/><rect x="280" y="0" width="40" height="40" class="cell trace"/><rect x="320" y="0" width="40" height="40" class="cell trace"/>
      <rect x="0" y="40" width="40" height="40" class="cell"/><rect x="40" y="40" width="40" height="40" class="cell"/><rect x="80" y="40" width="40" height="40" class="cell"/><rect x="120" y="40" width="40" height="40" class="cell"/><rect x="160" y="40" width="40" height="40" class="cell"/><rect x="200" y="40" width="40" height="40" class="cell"/><rect x="240" y="40" width="40" height="40" class="cell"/><rect x="280" y="40" width="40" height="40" class="cell"/><rect x="320" y="40" width="40" height="40" class="cell"/>
      <rect x="0" y="80" width="40" height="40" class="cell"/><rect x="40" y="80" width="40" height="40" class="cell"/><rect x="80" y="80" width="40" height="40" class="cell"/><rect x="120" y="80" width="40" height="40" class="cell"/><rect x="160" y="80" width="40" height="40" class="cell"/><rect x="200" y="80" width="40" height="40" class="cell"/><rect x="240" y="80" width="40" height="40" class="cell"/><rect x="280" y="80" width="40" height="40" class="cell"/><rect x="320" y="80" width="40" height="40" class="cell"/>
      <rect x="0" y="120" width="40" height="40" class="cell"/><rect x="40" y="120" width="40" height="40" class="cell"/><rect x="80" y="120" width="40" height="40" class="cell"/><rect x="120" y="120" width="40" height="40" class="cell"/><rect x="160" y="120" width="40" height="40" class="cell"/><rect x="200" y="120" width="40" height="40" class="cell"/><rect x="240" y="120" width="40" height="40" class="cell"/><rect x="280" y="120" width="40" height="40" class="cell"/><rect x="320" y="120" width="40" height="40" class="cell"/>
      <rect x="0" y="160" width="40" height="40" class="cell"/><rect x="40" y="160" width="40" height="40" class="cell"/><rect x="80" y="160" width="40" height="40" class="cell"/><rect x="120" y="160" width="40" height="40" class="cell"/><rect x="160" y="160" width="40" height="40" class="cell"/><rect x="200" y="160" width="40" height="40" class="cell"/><rect x="240" y="160" width="40" height="40" class="cell"/><rect x="280" y="160" width="40" height="40" class="cell"/><rect x="320" y="160" width="40" height="40" class="cell"/>
      <rect x="0" y="200" width="40" height="40" class="cell"/><rect x="40" y="200" width="40" height="40" class="cell"/><rect x="80" y="200" width="40" height="40" class="cell"/><rect x="120" y="200" width="40" height="40" class="cell"/><rect x="160" y="200" width="40" height="40" class="cell"/><rect x="200" y="200" width="40" height="40" class="cell"/><rect x="240" y="200" width="40" height="40" class="cell"/><rect x="280" y="200" width="40" height="40" class="cell"/><rect x="320" y="200" width="40" height="40" class="cell"/>
      <rect x="0" y="240" width="40" height="40" class="cell"/><rect x="40" y="240" width="40" height="40" class="cell"/><rect x="80" y="240" width="40" height="40" class="cell"/><rect x="120" y="240" width="40" height="40" class="cell"/><rect x="160" y="240" width="40" height="40" class="cell"/><rect x="200" y="240" width="40" height="40" class="cell"/><rect x="240" y="240" width="40" height="40" class="cell"/><rect x="280" y="240" width="40" height="40" class="cell"/><rect x="320" y="240" width="40" height="40" class="cell"/>
      <rect x="0" y="280" width="40" height="40" class="cell"/><rect x="40" y="280" width="40" height="40" class="cell"/><rect x="80" y="280" width="40" height="40" class="cell"/><rect x="120" y="280" width="40" height="40" class="cell"/><rect x="160" y="280" width="40" height="40" class="cell"/><rect x="200" y="280" width="40" height="40" class="cell"/><rect x="240" y="280" width="40" height="40" class="cell"/><rect x="280" y="280" width="40" height="40" class="cell"/><rect x="320" y="280" width="40" height="40" class="cell"/>
      <rect x="0" y="320" width="40" height="40" class="cell"/><rect x="40" y="320" width="40" height="40" class="cell"/><rect x="80" y="320" width="40" height="40" class="cell"/><rect x="120" y="320" width="40" height="40" class="cell"/><rect x="160" y="320" width="40" height="40" class="cell"/><rect x="200" y="320" width="40" height="40" class="cell"/><rect x="240" y="320" width="40" height="40" class="cell"/><rect x="280" y="320" width="40" height="40" class="cell"/><rect x="320" y="320" width="40" height="40" class="cell"/>
    </g>
    <rect x="80" y="200" width="40" height="40" class="pair-a"/>
    <rect x="240" y="120" width="40" height="40" class="pair-b"/>
    <line x1="100" y1="220" x2="260" y2="140" class="line"/>
  </g>

  <g transform="translate(555,115)">
    <rect x="0" y="0" width="18" height="18" class="trace"/>
    <text x="30" y="14" class="label">trace row: never eliminate</text>
    <rect x="0" y="42" width="18" height="18" class="pair-a"/>
    <rect x="0" y="70" width="18" height="18" class="pair-b"/>
    <text x="30" y="56" class="label">Hermiticity pair:</text>
    <text x="30" y="84" class="label">(alpha,beta) and (bar alpha,bar beta)</text>
  </g>
</svg>
