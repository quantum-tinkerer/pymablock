<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-labelledby="title desc">
  <title id="title">Row-major vectorization of a 3 by 3 operator</title>
  <desc id="desc">A 3 by 3 matrix is mapped to a length 9 vector by stacking rows.</desc>
  <defs>
    <style>
      .title { font: 600 18px sans-serif; fill: #25303b; }
      .label { font: 14px sans-serif; fill: #4f5d68; }
      .cell-text { font: 15px monospace; fill: #24313d; dominant-baseline: middle; text-anchor: middle; }
      .box { fill: #f8faf7; stroke: #bcc7bd; stroke-width: 1.2; }
      .row0 { fill: #dfeef8; }
      .row1 { fill: #e6f2de; }
      .row2 { fill: #f9ead7; }
      .arrow { stroke: #6b7280; stroke-width: 2.5; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="125" y="38" class="title">Operator matrix</text>
  <text x="580" y="38" class="title">row-major vec(rho)</text>

  <text x="58" y="94" class="label">row 0</text>
  <text x="58" y="154" class="label">row 1</text>
  <text x="58" y="214" class="label">row 2</text>

  <g transform="translate(115,70)">
    <rect x="0" y="0" width="70" height="55" class="box row0"/>
    <rect x="70" y="0" width="70" height="55" class="box row0"/>
    <rect x="140" y="0" width="70" height="55" class="box row0"/>
    <rect x="0" y="55" width="70" height="55" class="box row1"/>
    <rect x="70" y="55" width="70" height="55" class="box row1"/>
    <rect x="140" y="55" width="70" height="55" class="box row1"/>
    <rect x="0" y="110" width="70" height="55" class="box row2"/>
    <rect x="70" y="110" width="70" height="55" class="box row2"/>
    <rect x="140" y="110" width="70" height="55" class="box row2"/>
    <text x="35" y="28" class="cell-text">rho00</text>
    <text x="105" y="28" class="cell-text">rho01</text>
    <text x="175" y="28" class="cell-text">rho02</text>
    <text x="35" y="83" class="cell-text">rho10</text>
    <text x="105" y="83" class="cell-text">rho11</text>
    <text x="175" y="83" class="cell-text">rho12</text>
    <text x="35" y="138" class="cell-text">rho20</text>
    <text x="105" y="138" class="cell-text">rho21</text>
    <text x="175" y="138" class="cell-text">rho22</text>
  </g>

  <line x1="370" y1="152" x2="470" y2="152" class="arrow"/>
  <text x="382" y="132" class="label">stack rows</text>

  <g transform="translate(520,70)">
    <rect x="0" y="0" width="110" height="25" class="box row0"/>
    <rect x="0" y="25" width="110" height="25" class="box row0"/>
    <rect x="0" y="50" width="110" height="25" class="box row0"/>
    <rect x="0" y="75" width="110" height="25" class="box row1"/>
    <rect x="0" y="100" width="110" height="25" class="box row1"/>
    <rect x="0" y="125" width="110" height="25" class="box row1"/>
    <rect x="0" y="150" width="110" height="25" class="box row2"/>
    <rect x="0" y="175" width="110" height="25" class="box row2"/>
    <rect x="0" y="200" width="110" height="25" class="box row2"/>
    <text x="55" y="13" class="cell-text">rho00</text>
    <text x="55" y="38" class="cell-text">rho01</text>
    <text x="55" y="63" class="cell-text">rho02</text>
    <text x="55" y="88" class="cell-text">rho10</text>
    <text x="55" y="113" class="cell-text">rho11</text>
    <text x="55" y="138" class="cell-text">rho12</text>
    <text x="55" y="163" class="cell-text">rho20</text>
    <text x="55" y="188" class="cell-text">rho21</text>
    <text x="55" y="213" class="cell-text">rho22</text>
  </g>

  <text x="673" y="104" class="label">A acts on the first index.</text>
  <text x="673" y="132" class="label">B acts on the second index.</text>
  <text x="673" y="160" class="label">That gives A x B^T.</text>
</svg>
