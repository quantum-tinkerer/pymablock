rx="3" fill="#4a3aa7"/><text x="36" y="218" class="t-mono t-bold">block_diagonalize(H, emb)</text><text x="36" y="235" class="t-small t-muted">rejects unsupported options</text><rect x="340" y="196" width="600" height="62" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="2.5"/><rect x="340" y="196" width="6" height="62" rx="3" fill="#2a78d6"/><text x="356" y="218" class="t-mono t-bold">Embedding._prepare(H)</text><text x="356" y="235" class="t-small t-muted">① _convert_target(H0)  ② _sylvester_solver(h0)  ③ _frames(rows): W, Q = 1 − W W†  ④ _convert(H)</text><line x1="292" y1="227" x2="338" y2="227" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr)"/><text x="20" y="306" class="t-head" text-anchor="start">3 · lazy perturbation theory (pymablock&#x27;s series algorithm)</text><rect x="20" y="320" width="290" height="80" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="2.5"/><rect x="20" y="320" width="6" height="80" rx="3" fill="#2a78d6"/><text x="36" y="342" class="t-mono t-bold">H blocks H_ij = F_i† H F_j</text><text x="36" y="359" class="t-small t-muted">F_0 = W (retained), F_1 = Q (complement)</text><text x="36" y="377" class="t-mono t-small">entries: NOFs attached to W</text><rect x="335" y="320" width="290" height="80" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="2.5"/><rect x="335" y="320" width="6" height="80" rx="3" fill="#2a78d6"/><text x="351" y="342" class="t-mono t-bold">solve_sylvester(Y, index)</text><text x="351" y="359" class="t-small t-muted">returned by _sylvester_solver</text><text x="351" y="377" class="t-mono t-small">dispatch on the block index</text><rect x="650" y="320" width="290" height="80" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="2.5"/><rect x="650" y="320" width="6" height="80" rx="3" fill="#eb6834"/><text x="666" y="342" class="t-mono t-bold">products of blocks</text><text x="666" y="359" class="t-small t-muted">NumberOrderedForm.__mul__</text><text x="666" y="377" class="t-mono t-small">-&gt; _multiply_attached</text><line x1="312" y1="360" x2="333" y2="360" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr)"/><line x1="627" y1="360" x2="648" y2="360" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr)"/><rect x="20" y="450" width="290" height="112" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="2.5"/><rect x="20" y="450" width="6" height="112" rx="3" fill="#2a78d6"/><text x="36" y="472" class="t-mono t-bold">off-diagonal block (1, 0)</text><text x="36" y="489" class="t-small t-muted">divide_transition_entry</text><text x="36" y="507" class="t-mono t-small">value.act(incoming occupations)</text><text x="36" y="525" class="t-mono t-small">-&gt; _divide_by_energy_gap per term</text><text x="36" y="543" class="t-mono t-small">(0,1) from anti-Hermitian symmetry</text><rect x="335" y="450" width="290" height="112" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="2.5"/><rect x="335" y="450" width="6" height="112" rx="3" fill="#1baf7a"/><text x="351" y="472" class="t-mono t-bold">diagonal block (0,0) or (1,1)</text><text x="351" y="489" class="t-small t-muted">ordinary second-quantized solver</text><text x="351" y="507" class="t-mono t-small">solve_sylvester_2nd_quant</text><text x="351" y="525" class="t-mono t-small">-&gt; solve_scalar</text><text x="351" y="543" class="t-mono t-small">-&gt; _divide_by_energy_gap</text><rect x="650" y="450" width="290" height="112" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="2.5"/><rect x="650" y="450" width="6" height="112" rx="3" fill="#eb6834"/><text x="666" y="472" class="t-mono t-bold">attached products</text><text x="666" y="489" class="t-small t-muted">dispatch on the two attachments</text><text x="666" y="507" class="t-mono t-small">(W†X)(YW) -&gt; _contract = restrict</text><text x="666" y="525" class="t-mono t-small">(XW)(W†Y) -&gt; X · _projector · Y</text><text x="666" y="543" class="t-mono t-small">(XW)·Z    -&gt; X · _lift(Z)</text><line x1="420" y1="402" x2="200" y2="448" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr)"/><line x1="480" y1="402" x2="480" y2="448" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr)"/><line x1="795" y1="402" x2="795" y2="448" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr)"/><text x="20" y="592" class="t-small t-muted" text-anchor="start">Output: H̃[0, 0, order], the effective Hamiltonian in the source operators (generators) or as a matrix in list order (references).</text></svg>
